name: CI

# Roda a cada envio para a branch principal e em todo Pull Request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancela execuções antigas da mesma branch: evita fila e economiza minutos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Verificações rápidas primeiro: se o lint falhar, não gasta tempo no resto
  # ===========================================================================
  qualidade:
    name: Lint, formatação, tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Conferir formatação
        run: npm run format:check

      - name: Conferir tipos
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Guardar o site gerado
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7

  # ===========================================================================
  # Testes num navegador real, em desktop e celular
  # ===========================================================================
  testes:
    name: Testes end-to-end
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Rodar os testes
        run: npm run test:e2e

      - name: Guardar o relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7

  # ===========================================================================
  # Vulnerabilidades em dependências.
  # Não bloqueia o merge: o risco aceito está documentado em DECISOES.md.
  # ===========================================================================
  seguranca:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar
        run: npm audit --audit-level=high
